<dialog id="book-class-modal" class="modal">
  <form id="book-class-form" class="modal-card" method="dialog">
    <div class="modal-head">
      <div>
        <p class="eyebrow">Booking</p>
        <h3>Book a member into this class</h3>
      </div>
      <button type="button" class="icon-btn" data-close="book-class-modal">×</button>
    </div>
    <input type="hidden" name="classId" id="book-class-id">
    <div class="form-grid">
      <label>Member<select name="memberId" id="book-member-select"><option value="">Loading members...</option></select></label>
    </div>
    <div class="modal-actions">
      <button type="button" class="ghost-btn" data-close="book-class-modal">Cancel</button>
      <button type="submit" class="primary-btn">Book Member</button>
    </div>
  </form>
</dialog>
